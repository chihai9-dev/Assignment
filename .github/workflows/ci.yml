name: BrewLite CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # JOB 1: Backend (NestJS) — Install → Lint → Test → Build
  # ============================================================
  backend:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite123
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://brewlite:brewlite123@localhost:5432/brewlite_test?schema=public
      JWT_SECRET: ci-test-secret-key
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      # Step 1: Install
      - name: Install dependencies
        run: npm ci

      # Step 2: Lint
      - name: Run Lint (oxlint)
        run: npm run lint

      # Step 3: Prisma migrate (test DB)
      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      # Step 4: Test
      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

      # Step 5: Build
      - name: Build NestJS application
        run: npm run build

  # ============================================================
  # JOB 2: Frontend (Next.js) — Install → Lint → Build
  # ============================================================
  frontend:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # Step 1: Install
      - name: Install dependencies
        run: npm ci

      # Step 2: Lint
      - name: Run Lint (ESLint)
        run: npm run lint

      # Step 3: Build
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
